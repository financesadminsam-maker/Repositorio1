<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mis Finanzas</title>
    <meta name="description" content="Registro personal de ingresos, gastos, metas y presupuestos." />
    <meta name="theme-color" content="#07090d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzas" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      try {
        const t = localStorage.getItem('finanzas.theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand"><span class="brand-logo">$</span> Mis Finanzas</div>
        <nav class="side-nav" id="side-nav"></nav>
        <button class="btn btn-primary side-add" data-action="new-tx">＋ Nuevo movimiento</button>
        <div class="sync-pill" id="sync-pill-side"></div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="month-picker">
            <button class="icon-btn" data-action="month-prev" aria-label="Mes anterior">‹</button>
            <button class="month-label" id="month-label" data-action="month-today"></button>
            <button class="icon-btn" data-action="month-next" aria-label="Mes siguiente">›</button>
          </div>
          <div class="topbar-right">
            <div class="seg" role="group" aria-label="Moneda">
              <button data-action="currency" data-currency="MXN">MXN</button>
              <button data-action="currency" data-currency="USD">USD</button>
            </div>
            <button class="icon-btn mobile-only" data-action="go" data-view="ajustes" aria-label="Ajustes">⚙︎</button>
          </div>
        </header>
        <div class="ticker" id="ticker" aria-label="Indicadores"></div>
        <main id="view" class="view"></main>
      </div>

      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <script src="vendor/chart.umd.js"></script>
    <script src="vendor/supabase.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
